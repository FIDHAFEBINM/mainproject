<div class="card mt-3">
    <div class="card-header">
        <h5>Add Assignment</h5>
    </div>
    <div class="card-body">
        <form (ngSubmit)="submitAssignment()" #assignmentForm="ngForm">
            <!-- Title -->
            <div class="form-group">
                <label for="title">Title:</label>
                <input type="text" id="title" class="form-control" [(ngModel)]="assignment.title" name="title"
                    required />
            </div>

            <!-- Question -->
            <div class="form-group mt-2">
                <label for="question">Question:</label>
                <input type="text" id="question" class="form-control" [(ngModel)]="assignment.question" name="question"
                    required />
            </div>

            <!-- Teacher Answer -->
            <div class="form-group mt-2">
                <label for="teacherAnswer">Teacher's Answer:</label>
                <textarea id="teacherAnswer" class="form-control" [(ngModel)]="assignment.teacherAnswer"
                    name="teacherAnswer" required></textarea>
            </div>

            <!-- Viewed Status -->
            <!-- <div class="form-group mt-2" *ngIf="assignment.viewed">
            <label for="viewed">Viewed:</label>
            <input type="checkbox" id="viewed" class="form-control" [checked]="assignment.viewed" disabled />
          </div> -->


            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary mt-3" [disabled]="!assignmentForm.form.valid">
                Submit Assignment
            </button>

            <!-- Delete Button -->
            <button type="button" class="btn btn-danger mt-3 mx-2" *ngIf="ids" (click)="deleteAssignment(ids)">
                Delete Assignment
            </button>
        </form>
    </div>
</div>

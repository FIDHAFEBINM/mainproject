<div class="container mt-4">
    <h2 class="text-center">Payment Details</h2>
    <table class="table table-striped table-bordered mt-3">
      <thead class="table-dark">
        <tr>
          <th>User Name</th>
          <th>Course Name</th>
          <th>Amount paid </th>
          <th>Payment Date</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let payment of paymentData">
          <td>{{ payment.userId.username }}</td>
          <td>{{ payment.courseId.topic }}</td>
          <td>{{ payment.teacherAmount | currency : 'INR'}}</td>
          <td>{{ payment.paymentDate | date:'medium'}}</td>
        </tr>
      </tbody>
    </table>
  </div>

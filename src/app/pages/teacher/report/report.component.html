<!-- src/app/components/teacher-report/teacher-report.component.html -->
<div class="container mt-4">
  <h3 class="mb-3">Monthly Course Sales Report - {{ selectedYear }}</h3>

  <div class="form-group mb-4">
    <label>Select Year:</label>
    <select class="form-control w-auto d-inline ms-2" [(ngModel)]="selectedYear" (change)="fetchReport()">
      <option *ngFor="let y of years" [value]="y">{{ y }}</option>
    </select>
  </div>

  <div *ngIf="loading" class="text-primary">Loading...</div>

  <table class="table table-bordered" *ngIf="!loading && report.length">
    <thead class="table-dark">
      <tr>
        <th>Month</th>
        <th>Total Earnings (₹)</th>
        <th>Courses Sold</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let monthReport of report">
        <td>{{ getMonthName(monthReport.month) }}</td>
        <td>₹{{ monthReport.totalEarnings }}</td>
        <td>
          <ul class="mb-0">
            <li *ngFor="let course of monthReport.courses">
              <strong>{{ course.name }}</strong>: {{ course.sold }} sold (₹{{ course.earnings }})
            </li>
          </ul>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!loading && report.length === 0" class="text-muted">
    No data available for {{ selectedYear }}.
  </div>
</div>
